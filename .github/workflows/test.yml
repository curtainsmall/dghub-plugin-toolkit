name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test-sdk:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK and test dependencies
        run: python -m pip install -e ".[test]"
        working-directory: sdk/python

      - name: Run SDK tests
        run: python -m pytest -q
        working-directory: sdk/python

  test-packer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Run Packer logic tests
        run: uv run --extra test pytest -q
        working-directory: packer
