[project]
name = "dghub-plugin-studio"
version = "0.0.0"
description = "DGHub SDK Studio — visual build tool for DGHub plugins"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.0",
    "pyinstaller>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# backend/gui/cli 为 src 下的顶层包（测试经 sys.path 注入）
extraPaths = ["src"]

[tool.uv]
# Packer 是应用而非库，uv sync 仅安装依赖，不构建自身
package = false
