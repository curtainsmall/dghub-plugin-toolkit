name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
      sdk_ts: ${{ steps.filter.outputs.sdk_ts }}
    steps:
      - name: Checkout (full history for tag diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether sdk/python changed since previous tag
        id: filter
        shell: bash
        run: |
          current="${{ github.ref_name }}"
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${current}^" 2>/dev/null || echo "")
          if [ -z "$prev" ]; then
            echo "No previous v* tag; treating SDK as changed (first release)."
            echo "sdk=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$prev" "$current" -- sdk/python; then
            echo "sdk/python unchanged between $prev and $current; skipping SDK build/publish."
            echo "sdk=false" >> "$GITHUB_OUTPUT"
          else
            echo "sdk/python changed between $prev and $current; building SDK."
            echo "sdk=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$prev" "$current" -- sdk/typescript; then
            echo "sdk/typescript unchanged; skipping TS publish."
            echo "sdk_ts=false" >> "$GITHUB_OUTPUT"
          else
            echo "sdk/typescript changed; will publish to npm."
            echo "sdk_ts=true" >> "$GITHUB_OUTPUT"
          fi

  build-packer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync
        working-directory: packer

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --confirm
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found after Chocolatey install" }
          $dir = Split-Path $iscc -Parent
          echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Download Simplified Chinese language file
        shell: pwsh
        run: |
          $langDir = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
          $file = "ChineseSimplified.isl"
          $path = Join-Path $langDir $file
          if (-not (Test-Path $path)) {
            $url = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/$file"
            curl.exe -L -o $path $url 2>$null
            if (-not (Test-Path $path)) { Write-Warning "Failed to download $file" }
          }

      - name: Build installer (onedir + Inno Setup)
        run: |
          uv run build.py
        env:
          CI_VERSION_TAG: ${{ github.ref_name }}
        working-directory: packer

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DGHubSDKPacker-${{ github.ref_name }}
          path: packer/installer/dghub-sdk-packer-setup.exe

  build-sdk-py:
    needs: detect-changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          pip install -r requirements.txt
        working-directory: sdk/python

      - name: Build SDK package
        run: |
          python build_sdk.py
        env:
          CI_VERSION_TAG: ${{ github.ref_name }}
        working-directory: sdk/python

      - name: Upload SDK wheel
        uses: actions/upload-artifact@v4
        with:
          name: dghub-sdk-${{ github.ref_name }}
          path: sdk/python/dist/*

  build-sdk-ts:
    needs: detect-changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci
        working-directory: sdk/typescript

      - name: Build
        run: npm run build
        working-directory: sdk/typescript

      - name: Test
        run: npm test
        working-directory: sdk/typescript

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dghub-sdk-ts-${{ github.ref_name }}
          path: sdk/typescript/dist/*

  release:
    needs: [detect-changes, build-packer, build-sdk-py, build-sdk-ts]
    if: always() && needs.build-packer.result == 'success' && needs.build-sdk-py.result == 'success' && needs.build-sdk-ts.result == 'success' && needs.detect-changes.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for CHANGELOG.md)
        uses: actions/checkout@v4

      - name: Download Packer installer artifact
        uses: actions/download-artifact@v4
        with:
          name: DGHubSDKPacker-${{ github.ref_name }}
          path: release-files

      - name: Strip tag prefix
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Read changelog entry
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.ver.outputs.version }}
          path: ./CHANGELOG.md

      - name: Compose SDK note
        id: sdknote
        shell: bash
        run: |
          echo "note=dghub-sdk 更新：\`pip install -U dghub-sdk\` / \`npm install dghub-sdk\`。" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ${{ steps.changelog.outputs.changes }}

            ---
            ${{ steps.sdknote.outputs.note }}
          files: release-files/*

  publish-pypi:
    needs: [detect-changes, build-sdk-py]
    runs-on: ubuntu-latest

    steps:
      - name: Download SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: dghub-sdk-${{ github.ref_name }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm:
    needs: [detect-changes, build-sdk-ts]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download TS SDK dist
        uses: actions/download-artifact@v4
        with:
          name: dghub-sdk-ts-${{ github.ref_name }}
          path: sdk/typescript/dist

      - name: Set version from tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version "$VER"
        working-directory: sdk/typescript

      - name: Publish to npm
        run: npm publish --provenance
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
